name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django tests and schema
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-key-not-for-production
      APP_DEBUG: "False"
      POSTGRES_DB: sehatsaathi_ci
      POSTGRES_USER: sehatsaathi
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sehatsaathi_ci
          POSTGRES_USER: sehatsaathi
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sehatsaathi -d sehatsaathi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/development.txt

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt
          python -m pip check

      - name: Compile Bengali and Hindi translations
        run: |
          python manage.py compilemessages -l bn -l hi --ignore=".venv"

      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run backend tests
        run: python -m pytest --create-db -q

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular \
            --file "$RUNNER_TEMP/backend-schema.yml" \
            --validate \
            --fail-on-warn